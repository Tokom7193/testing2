<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#081322">

    <title>A Letter For You</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="letterPage">


<div class="letterBackground">


    <!-- Decorative Stars -->
    <div class="letterStars" aria-hidden="true"></div>



    <!-- Intro -->
    <div class="letterIntro">


        <h1>
            A Letter For You 💌
        </h1>


        <p>
            There's something I've wanted
            to tell you...
        </p>



        <!-- Envelope -->
        <div class="envelopeContainer">


            <div class="envelope"
                 id="envelope"
                 role="button"
                 aria-label="Open letter envelope"
                 onclick="openEnvelope()">



                <!-- Back of envelope -->
                <div class="envelopeBack"></div>



                <!-- Letter -->
                <div class="letterPaper">


                    <div class="letterContent">


                        <h2>
                            Dear SUAR,
                        </h2>



                        <div class="letterBody">


                            <div id="typewriter"></div>



                            <div id="cursor"
                                 class="typingCursor">
                            </div>



                            <div id="signature"
                                 class="signature">

                                With love,<br>

                                Rijin <span>❤️</span>

                            </div>



                            <div id="finalMessage"
                                 class="finalMessage">

                                <h2>
                                    Thank you for being you ❤️
                                </h2>

                                <p>
                                    Never change.
                                </p>

                            </div>



                        </div>


                    </div>


                </div>



                <!-- Envelope flap -->
                <div class="envelopeFlap"></div>



                <!-- Envelope front -->
                <div class="envelopeFront"></div>



                <!-- Seal -->
                <div class="envelopeSeal">
                    ❤️
                </div>



            </div>


        </div>



    </div>



</div>



<script src="letter.js" defer></script>


</body>


</html>
